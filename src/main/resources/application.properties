# Shared settings for every environment. Environment-specific values live in
# application-dev.properties / application-prod.properties. Secrets come from environment variables.

spring.application.name=chequetrack
spring.profiles.default=dev

# JPA: no lazy loading from views; Flyway owns the schema, Hibernate only checks it
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Timestamps stored in UTC (ARCHITECTURE.md section 3)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Web
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application
app.business-time-zone=Asia/Dhaka

# Security: password policy (expiry-days=0 turns expiry off, history-count=0 allows reuse)
app.security.password.min-length=8
app.security.password.require-uppercase=true
app.security.password.require-lowercase=true
app.security.password.require-digit=true
app.security.password.require-special=true
app.security.password.history-count=3
app.security.password.expiry-days=90

# Security: account lockout after repeated failed logins
app.security.lockout.max-failed-attempts=5
app.security.lockout.lock-minutes=15

# Security: API tokens. The secret is a Base64 key of at least 32 bytes, set per environment.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=chequetrack
app.security.jwt.expiry-minutes=60

# Security: first administrator, created only when there are no users.
# Leave the password empty to generate a random one (printed once in the log).
app.security.bootstrap.admin-username=admin
app.security.bootstrap.admin-password=${ADMIN_INITIAL_PASSWORD:}
