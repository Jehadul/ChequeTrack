# Local development: JDK 17 + local PostgreSQL.
# Create the database once with scripts/db/create-database.sql.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chequetrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.thymeleaf.cache=false

management.endpoint.health.show-details=always

logging.level.com.chequetrack=DEBUG

# Development-only secrets. Never use these values in production.
