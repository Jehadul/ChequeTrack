<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · ChequeTrack</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card card shadow-sm">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-journal-check login-logo"></i>
            <h1 class="h4 mt-2 mb-0">ChequeTrack</h1>
            <p class="text-secondary small">Cheque management and printing</p>
        </div>

        <div th:if="${loginError}" class="alert alert-danger py-2 small" role="alert" th:text="${loginError}"></div>
        <div th:if="${loginInfo}" class="alert alert-success py-2 small" role="status" th:text="${loginInfo}"></div>

        <form th:action="@{/login}" method="post" autocomplete="off">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus
                       autocapitalize="none" spellcheck="false" maxlength="50">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Log in
            </button>
        </form>
        <p class="text-secondary small text-center mt-3 mb-0">
            Forgot your password? Ask your administrator to reset it.
        </p>
    </div>
</main>
</body>
</html>
