<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${mode == 'inbox'} ? 'Approval inbox' : 'My requests'">Approvals</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-inbox"></i>
            <span th:text="${mode == 'inbox'} ? 'Approval inbox' : 'My approval requests'">Approvals</span></h1>
        <div class="btn-group btn-group-sm ms-auto">
            <a sec:authorize="hasAuthority('APPROVAL_DECIDE')" th:href="@{/approvals}" class="btn"
               th:classappend="${mode == 'inbox'} ? 'btn-primary' : 'btn-outline-primary'">Waiting for me</a>
            <a th:href="@{/approvals/mine}" class="btn" th:classappend="${mode == 'mine'} ? 'btn-primary' : 'btn-outline-primary'">My requests</a>
        </div>
    </div>
    <p class="text-secondary small" th:if="${mode == 'inbox'}">
        Requests whose next step needs your role. You never see your own requests here, and you can decide only one step of a request.
    </p>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Requested</th>
                    <th>Action</th>
                    <th>Cheque</th>
                    <th class="text-end">Amount</th>
                    <th th:if="${mode == 'inbox'}">By</th>
                    <th>Steps</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${requests}">
                    <td class="small text-nowrap"><a th:href="@{/approvals/{id}(id=${r.id})}" th:text="${@displayFormat.ts(r.requestedAt)}">time</a></td>
                    <td><span class="badge text-bg-warning" th:text="${r.approvalAction.label}">Void</span></td>
                    <td class="small" th:text="${r.recordLabel}">Cheque</td>
                    <td class="amount" th:text="${@displayFormat.amount(r.amount)}">0.00</td>
                    <td th:if="${mode == 'inbox'}" th:text="${r.requestedBy}">user</td>
                    <td class="small">
                        <span th:each="s, it : ${r.steps}">
                            <i class="bi" th:classappend="${s.status.name() == 'APPROVED'} ? 'bi-check-circle-fill text-success' : (${s.status.name() == 'REJECTED'} ? 'bi-x-circle-fill text-danger' : 'bi-circle text-secondary')"></i>
                            <span th:text="${s.roleName}">role</span><span th:unless="${it.last}"> → </span>
                        </span>
                    </td>
                    <td th:insert="~{fragments/forms :: approvalStatus(${r.status})}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="7" class="text-center text-secondary py-4"
                        th:text="${mode == 'inbox'} ? 'Nothing is waiting for you.' : 'You have not made any approval requests.'">Empty</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
