<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title>Approval request</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-person-check"></i> <span th:text="${r.approvalAction.label}">Void a cheque</span></h1>
        <span th:replace="~{fragments/forms :: approvalStatus(${r.status})}"></span>
        <a th:href="@{/approvals/mine}" class="btn btn-link btn-sm ms-auto"><i class="bi bi-arrow-left"></i> My requests</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card mb-3">
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Cheque</dt>
                        <dd class="col-sm-8">
                            <a th:if="${recordUrl}" th:href="@{${recordUrl}}" th:text="${r.recordLabel}">Cheque</a>
                            <span th:unless="${recordUrl}" th:text="${r.recordLabel}">Cheque</span>
                        </dd>
                        <dt class="col-sm-4">Amount</dt>
                        <dd class="col-sm-8" th:text="|Tk ${@displayFormat.amount(r.amount)}|"></dd>
                        <dt class="col-sm-4">Requested by</dt>
                        <dd class="col-sm-8" th:text="|${r.requestedBy}, ${@displayFormat.ts(r.requestedAt)}|"></dd>
                        <dt class="col-sm-4">Reason</dt>
                        <dd class="col-sm-8" th:text="${r.reason} ?: '-'"></dd>
                        <th:block th:if="${r.payload}">
                            <dt class="col-sm-4">Details</dt>
                            <dd class="col-sm-8">
                                <div th:each="p : ${r.payload}" class="small"><span class="text-secondary" th:text="${p.key}">key</span>: <span th:text="${p.value}">value</span></div>
                            </dd>
                        </th:block>
                        <dt class="col-sm-4">Closed</dt>
                        <dd class="col-sm-8 mb-0" th:text="${r.closedAt} ? ${@displayFormat.ts(r.closedAt)} : '-'"></dd>
                    </dl>
                </div>
            </div>

            <div class="card" th:if="${canDecide}">
                <div class="card-header bg-white fw-semibold">Your decision</div>
                <div class="card-body">
                    <!-- th:action makes Thymeleaf add the CSRF token; each button overrides the target with formaction -->
                    <form th:action="@{/approvals/{id}/approve(id=${r.id})}" method="post" id="decisionForm">
                        <label for="comment" class="form-label small">Comment <span class="text-secondary">(required to reject)</span></label>
                        <textarea id="comment" name="comment" class="form-control mb-2" rows="2" maxlength="500"></textarea>
                        <button type="submit" class="btn btn-success" th:formaction="@{/approvals/{id}/approve(id=${r.id})}"
                                onclick="return confirm('Approve this request?')"><i class="bi bi-check-lg"></i> Approve</button>
                        <button type="submit" class="btn btn-outline-danger" th:formaction="@{/approvals/{id}/reject(id=${r.id})}"
                                onclick="return confirm('Reject this request?')"><i class="bi bi-x-lg"></i> Reject</button>
                    </form>
                </div>
            </div>

            <form th:if="${r.status.name() == 'PENDING' and r.requestedById == #authentication.principal.id}"
                  th:action="@{/approvals/{id}/withdraw(id=${r.id})}" method="post" class="mt-3"
                  onsubmit="return confirm('Withdraw your request?')">
                <button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-counterclockwise"></i> Withdraw my request</button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="card">
                <div class="card-header bg-white fw-semibold">Approval steps</div>
                <ol class="list-group list-group-flush list-group-numbered">
                    <li class="list-group-item d-flex gap-2" th:each="s : ${r.steps}">
                        <div class="me-auto">
                            <div class="fw-semibold" th:text="${s.roleName}">Accounts Manager</div>
                            <div class="small text-secondary" th:if="${s.decidedBy}"
                                 th:text="|${s.decidedBy}, ${@displayFormat.ts(s.decidedAt)}|">by</div>
                            <div class="small" th:if="${s.comment}"><em th:text="${s.comment}">comment</em></div>
                        </div>
                        <span class="badge align-self-start" th:text="${#strings.replace(s.status.name(), '_', ' ')}"
                              th:classappend="${s.status.name() == 'APPROVED'} ? 'text-bg-success' : (${s.status.name() == 'REJECTED'} ? 'text-bg-danger' : (${s.status.name() == 'WAITING'} ? 'text-bg-warning' : 'text-bg-light border'))">WAITING</span>
                    </li>
                </ol>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
