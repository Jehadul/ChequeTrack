<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${user.username}">User</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-person"></i> <span th:text="${user.fullName}">Name</span></h1>
        <a th:href="@{/admin/users/{id}/history(id=${user.id})}" class="btn btn-outline-secondary btn-sm ms-auto">
            <i class="bi bi-clock-history"></i> History</a>
        <a th:href="@{/admin/users}" class="btn btn-link btn-sm"><i class="bi bi-arrow-left"></i> All users</a>
    </div>

    <div th:if="${temporaryPassword}" class="alert alert-warning">
        <i class="bi bi-key"></i> Temporary password for <strong th:text="${user.username}"></strong>:
        <code class="fs-5 ms-1 user-select-all" th:text="${temporaryPassword}"></code>
        <div class="small mt-1">It is shown only once. Give it to the user privately; they must change it at first login.</div>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Username</dt>
                        <dd class="col-sm-8" th:text="${user.username}"></dd>
                        <dt class="col-sm-4">Email</dt>
                        <dd class="col-sm-8" th:text="${user.email} ?: '-'"></dd>
                        <dt class="col-sm-4">Role</dt>
                        <dd class="col-sm-8" th:text="${user.roleName}"></dd>
                        <dt class="col-sm-4">Home branch</dt>
                        <dd class="col-sm-8" th:text="${user.homeBranch}"></dd>
                        <dt class="col-sm-4">Branch access</dt>
                        <dd class="col-sm-8" th:text="${user.branchScope()}"></dd>
                        <dt class="col-sm-4">Status</dt>
                        <dd class="col-sm-8" th:insert="~{fragments/forms :: userStatus(${user})}"></dd>
                        <dt class="col-sm-4">Last login</dt>
                        <dd class="col-sm-8 mb-0"
                            th:text="${user.lastLoginAt} ? ${#temporals.format(user.lastLoginAt, 'dd/MM/yyyy HH:mm')} : 'Never'"></dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-lg-5" sec:authorize="hasAuthority('USER_MANAGE')">
            <div class="card">
                <div class="card-header bg-white fw-semibold">Actions</div>
                <div class="card-body d-grid gap-2">
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil"></i> Edit details and access</a>
                    <form th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post" class="d-grid"
                          onsubmit="return confirm('Reset this user\'s password?')">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-key"></i> Reset password</button>
                    </form>
                    <form th:if="${user.locked}" th:action="@{/admin/users/{id}/unlock(id=${user.id})}" method="post" class="d-grid">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-unlock"></i> Unlock</button>
                    </form>
                    <form th:if="${user.enabled}" th:action="@{/admin/users/{id}/disable(id=${user.id})}" method="post"
                          class="border rounded p-2" onsubmit="return confirm('Disable this user? They will be logged out.')">
                        <label for="disableReason" class="form-label small mb-1">Reason for disabling <span class="text-danger">*</span></label>
                        <input type="text" id="disableReason" name="reason" class="form-control form-control-sm mb-2"
                               required maxlength="300" placeholder="e.g. Left the company">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-person-x"></i> Disable</button>
                    </form>
                    <form th:unless="${user.enabled}" th:action="@{/admin/users/{id}/enable(id=${user.id})}" method="post"
                          class="border rounded p-2">
                        <label for="enableReason" class="form-label small mb-1">Reason (optional)</label>
                        <input type="text" id="enableReason" name="reason" class="form-control form-control-sm mb-2" maxlength="300">
                        <button type="submit" class="btn btn-outline-success btn-sm w-100"><i class="bi bi-person-check"></i> Enable</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
