<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title>Users</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-people"></i> Users</h1>
        <a sec:authorize="hasAuthority('USER_MANAGE')" th:href="@{/admin/users/new}"
           class="btn btn-primary btn-sm ms-auto"><i class="bi bi-person-plus"></i> New user</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Home branch</th>
                    <th>Branch access</th>
                    <th>Status</th>
                    <th>Last login</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td><a th:href="@{/admin/users/{id}(id=${u.id})}" class="fw-semibold" th:text="${u.username}">admin</a></td>
                    <td th:text="${u.fullName}">Name</td>
                    <td th:text="${u.roleName}">Role</td>
                    <td th:text="${u.homeBranch}">HO</td>
                    <td class="small" th:text="${u.branchScope()}">HO</td>
                    <td th:insert="~{fragments/forms :: userStatus(${u})}"></td>
                    <td class="small text-secondary"
                        th:text="${u.lastLoginAt} ? ${#temporals.format(u.lastLoginAt, 'dd/MM/yyyy HH:mm')} : 'Never'">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="7" class="text-center text-secondary py-4">No users.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
