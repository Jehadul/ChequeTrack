<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>New deposit</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center mb-1">
        <h1 class="h4 mb-0"><i class="bi bi-bank"></i> New deposit</h1>
        <a th:href="@{/received/deposits}" class="btn btn-link btn-sm ms-auto"><i class="bi bi-arrow-left"></i> Deposits</a>
    </div>
    <p class="text-secondary small">Cheques in hand dated on or before the deposit date. Post-dated cheques appear once their date is reached.</p>

    <form th:action="@{/received/deposits/new}" method="get" class="d-flex gap-2 align-items-end mb-3">
        <div>
            <label class="form-label small mb-1" for="dateFilter">Deposit date</label>
            <input type="date" id="dateFilter" name="date" class="form-control form-control-sm" th:value="${form.depositDate}">
        </div>
        <button type="submit" class="btn btn-outline-secondary btn-sm">Show cheques due</button>
    </form>

    <form th:action="@{/received/deposits}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/forms :: globalErrors}"></div>
        <div th:if="${#fields.hasErrors('chequeIds')}" class="alert alert-danger py-2" th:errors="*{chequeIds}"></div>
        <input type="hidden" th:field="*{depositDate}">

        <div class="card mb-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 2rem"><input type="checkbox" class="form-check-input" id="tickAll" title="Tick all"></th>
                        <th>Cheque date</th><th>Cheque no.</th><th>Customer</th><th>Drawer bank</th><th class="text-end">Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${due}">
                        <td><input type="checkbox" class="form-check-input cheque-tick" th:field="*{chequeIds}" th:value="${c.id}"
                                   th:attr="data-amount=${c.amount}"></td>
                        <td th:text="${@displayFormat.date(c.chequeDate)}"></td>
                        <td><a class="font-monospace" th:href="@{/received/{id}(id=${c.id})}" th:text="${c.chequeNumber}">1</a></td>
                        <td th:text="${c.party.name}"></td>
                        <td class="small" th:text="${c.drawerBankBranch.label}"></td>
                        <td class="amount" th:text="${@displayFormat.amount(c.amount)}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(due)}"><td colspan="6" class="text-center text-secondary py-4">No cheques are due for deposit on this date.</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white small" th:unless="${#lists.isEmpty(due)}">
                Ticked: <strong id="tickCount">0</strong> cheque(s), Tk <strong id="tickTotal">0.00</strong>
            </div>
        </div>

        <div class="card mb-3" style="max-width: 760px" th:unless="${#lists.isEmpty(due)}">
            <div class="card-body row g-2">
                <div class="col-md-7">
                    <label for="accountId" class="form-label">Deposit into <span class="text-danger">*</span></label>
                    <select th:field="*{accountId}" class="form-select" th:classappend="${#fields.hasErrors('accountId')} ? 'is-invalid'">
                        <option value="">Choose…</option>
                        <option th:each="a : ${accounts}" th:value="${a.id}" th:text="|${a.bankBranch.bank.name} · ${a.accountNumber} · ${a.accountName}|">Account</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{accountId}"></div>
                </div>
                <div class="col-md-5">
                    <label for="notes" class="form-label">Notes</label>
                    <input type="text" th:field="*{notes}" class="form-control" maxlength="300">
                </div>
            </div>
        </div>
        <button th:unless="${#lists.isEmpty(due)}" type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Record deposit</button>
    </form>
</th:block>

<th:block layout:fragment="scripts">
    <script>
        $(function () {
            function sum() {
                let n = 0, total = 0;
                $('.cheque-tick:checked').each(function () { n++; total += parseFloat($(this).data('amount')); });
                $('#tickCount').text(n);
                $('#tickTotal').text(total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            }
            $('#tickAll').on('change', function () { $('.cheque-tick').prop('checked', this.checked); sum(); });
            $('.cheque-tick').on('change', sum);
            sum();
        });
    </script>
</th:block>
</body>
</html>
