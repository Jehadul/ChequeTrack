<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="|Deposit ${batch.number}|">Deposit</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3 d-print-none">
        <h1 class="h4 mb-0"><i class="bi bi-bank"></i> Deposit <span class="font-monospace" th:text="${batch.number}">DEP</span></h1>
        <button type="button" class="btn btn-primary btn-sm ms-auto" onclick="window.print()"><i class="bi bi-printer"></i> Print slip</button>
        <a th:href="@{/received/deposits}" class="btn btn-link btn-sm"><i class="bi bi-arrow-left"></i> Deposits</a>
    </div>

    <div class="card deposit-slip">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <div class="h5 mb-0">Cheque deposit slip</div>
                    <div class="text-secondary" th:text="${batch.account.bankBranch.label}">Bank, branch</div>
                </div>
                <div class="text-end">
                    <div><span class="text-secondary">Slip no.</span> <strong class="font-monospace" th:text="${batch.number}">DEP</strong></div>
                    <div><span class="text-secondary">Date</span> <strong th:text="${@displayFormat.date(batch.depositDate)}">date</strong></div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-6"><span class="text-secondary">Account name</span><div class="fw-semibold" th:text="${batch.account.accountName}"></div></div>
                <div class="col-sm-6"><span class="text-secondary">Account number</span><div class="fw-semibold font-monospace" th:text="${batch.account.accountNumber}"></div></div>
            </div>
            <table class="table table-bordered table-sm align-middle mb-2">
                <thead>
                <tr><th style="width: 3rem">#</th><th>Cheque no.</th><th>Drawer bank / branch</th><th>Routing no.</th><th>Cheque date</th><th class="text-end">Amount (Tk)</th></tr>
                </thead>
                <tbody>
                <tr th:each="c, it : ${cheques}">
                    <td th:text="${it.count}">1</td>
                    <td class="font-monospace" th:text="${c.chequeNumber}"></td>
                    <td th:text="|${c.drawerBank.name}, ${c.drawerBankBranch.name}|"></td>
                    <td class="font-monospace" th:text="${c.drawerBankBranch.routingNumber}"></td>
                    <td th:text="${@displayFormat.date(c.chequeDate)}"></td>
                    <td class="amount" th:text="${@displayFormat.amount(c.amount)}"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr class="fw-semibold">
                    <td colspan="5" class="text-end" th:text="|Total (${batch.chequeCount} cheques)|">Total</td>
                    <td class="amount" th:text="${@displayFormat.amount(batch.totalAmount)}">0.00</td>
                </tr>
                </tfoot>
            </table>
            <div class="row mt-5 small text-secondary">
                <div class="col-6">Depositor's signature ____________________</div>
                <div class="col-6 text-end">Bank's seal and signature ____________________</div>
            </div>
            <div class="small text-secondary mt-3" th:if="${batch.notes}" th:text="${batch.notes}"></div>
        </div>
    </div>
</th:block>
</body>
</html>
