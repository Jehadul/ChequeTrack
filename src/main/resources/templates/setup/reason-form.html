<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Edit reason</title>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="h4 mb-3"><i class="bi bi-list-check"></i> Edit <span th:text="${form.reasonType.label.toLowerCase()}">bounce</span> reason</h1>

    <div class="card" style="max-width: 640px">
        <div class="card-body">
            <form th:action="@{/setup/reasons/{id}(id=${form.id})}" th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{version}">
                <input type="hidden" th:field="*{reasonType}">
                <input type="hidden" th:field="*{code}">
                <div class="mb-3">
                    <label class="form-label">Code</label>
                    <input type="text" class="form-control" th:value="*{code}" disabled>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{description}" class="form-control" maxlength="200"
                           th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <div class="mb-3" style="max-width: 160px">
                    <label for="sortOrder" class="form-label">Order</label>
                    <input type="number" th:field="*{sortOrder}" class="form-control" min="0" max="999">
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a th:href="@{/setup/reasons}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
