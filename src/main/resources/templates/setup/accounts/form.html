<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${form.id} ? 'Edit account' : 'New account'">Account</title>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="h4 mb-3"><i class="bi bi-safe"></i> <span th:text="${form.id} ? 'Edit company bank account' : 'New company bank account'">Account</span></h1>

    <div class="card" style="max-width: 820px">
        <div class="card-body">
            <form th:action="${form.id} ? @{/setup/accounts/{id}(id=${form.id})} : @{/setup/accounts}"
                  th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{version}">
                <div th:replace="~{fragments/forms :: globalErrors}"></div>

                <div class="mb-3">
                    <label for="bankBranchId" class="form-label">Bank branch <span class="text-danger">*</span></label>
                    <select th:field="*{bankBranchId}" class="form-select" th:classappend="${#fields.hasErrors('bankBranchId')} ? 'is-invalid'">
                        <option value="">Choose…</option>
                        <option th:each="bb : ${bankBranches}" th:value="${bb.id}" th:text="${bb.label}">Bank, branch</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{bankBranchId}"></div>
                    <div class="form-text" th:if="${#lists.isEmpty(bankBranches)}">
                        No bank branches yet. Add them under <a th:href="@{/setup/banks}">Banks</a> first.
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label for="accountNumber" class="form-label">Account number <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{accountNumber}" class="form-control font-monospace" maxlength="30"
                               th:classappend="${#fields.hasErrors('accountNumber')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{accountNumber}"></div>
                    </div>
                    <div class="col-md-7 mb-3">
                        <label for="accountName" class="form-label">Account name <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{accountName}" class="form-control" maxlength="150"
                               th:classappend="${#fields.hasErrors('accountName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{accountName}"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="accountType" class="form-label">Type <span class="text-danger">*</span></label>
                        <select th:field="*{accountType}" class="form-select">
                            <option th:each="t : ${accountTypes}" th:value="${t}" th:text="${t.label}">Current</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="branchId" class="form-label">Operated by <span class="text-danger">*</span></label>
                        <select th:field="*{branchId}" class="form-select" th:classappend="${#fields.hasErrors('branchId')} ? 'is-invalid'">
                            <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.label}">HO</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{branchId}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="glCode" class="form-label">GL code</label>
                        <input type="text" th:field="*{glCode}" class="form-control" maxlength="30">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                <a th:href="@{/setup/accounts}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
