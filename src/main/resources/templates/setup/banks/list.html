<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title>Banks</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-bank"></i> Banks</h1>
        <a sec:authorize="hasAuthority('BANK_MANAGE')" th:href="@{/setup/banks/new}"
           class="btn btn-primary btn-sm ms-auto"><i class="bi bi-plus-lg"></i> New bank</a>
    </div>
    <p class="text-secondary small">Banks and their branches (routing numbers). Used for company accounts and for cheques you receive.</p>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>SWIFT</th>
                    <th class="text-end">Branches</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${banks}">
                    <td class="fw-semibold"><a th:href="@{/setup/banks/{id}(id=${b.id})}" th:text="${b.code}">DBBL</a></td>
                    <td><a th:href="@{/setup/banks/{id}(id=${b.id})}" th:text="${b.name}">Bank</a></td>
                    <td class="small" th:text="${b.swiftCode}"></td>
                    <td class="text-end" th:text="${branchCounts[b.id]} ?: 0">0</td>
                    <td><span th:replace="~{fragments/forms :: activeBadge(${b.active})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
