<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Home</title>
</head>
<body>
<th:block layout:fragment="content">
    <h1 class="h3 mb-3">Welcome to ChequeTrack</h1>
    <p class="text-secondary">
        Manage, track and print received and issued cheques in one place.
    </p>

    <div class="card">
        <div class="card-body">
            <h2 class="h6 card-title">System status</h2>
            <p class="mb-0">
                <i class="bi bi-check-circle-fill text-success"></i>
                Application is running. Database health:
                <a th:href="@{/actuator/health}">/actuator/health</a>
            </p>
        </div>
    </div>
</th:block>
</body>
</html>
