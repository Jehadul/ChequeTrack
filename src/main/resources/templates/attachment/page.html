<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Attachments</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-paperclip"></i> <span th:text="${owner.label}">Record</span></h1>
        <a th:href="@{${owner.url}}" class="btn btn-link btn-sm ms-auto"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div style="max-width: 900px">
        <div th:replace="~{fragments/attachments :: panel(${ownerType}, ${ownerId}, ${attachments}, ${owner.canModify}, ${categories})}"></div>
    </div>
</th:block>
</body>
</html>
