<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${heading}">ChequeTrack</title>
</head>
<body style="margin:0; padding:0; background:#f5f7fa; font-family:Arial, Helvetica, sans-serif; color:#212529;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;">
    <tr><td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border:1px solid #dee2e6;">
            <tr><td style="background:#1f4e79; color:#ffffff; padding:14px 20px; font-size:16px; font-weight:bold;">ChequeTrack</td></tr>
            <tr><td style="padding:18px 20px 6px; font-size:17px; font-weight:bold;" th:text="${heading}">Heading</td></tr>
            <tr><td style="padding:0 20px; font-size:14px; line-height:1.5;">
                <div th:each="l : ${lines}" th:text="${l}">line</div>
            </td></tr>
            <tr th:if="${link}"><td style="padding:18px 20px;">
                <a th:href="${link}" th:text="${linkText}" style="display:inline-block; background:#1f4e79; color:#ffffff; padding:10px 16px; text-decoration:none; border-radius:4px; font-size:14px;">Open</a>
            </td></tr>
            <tr><td style="padding:0 20px 16px; font-size:11px; color:#6c757d;">Sent automatically by ChequeTrack.</td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
