<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="|History · ${user.username}|">History</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-clock-history"></i> History of <span th:text="${user.fullName}">Name</span></h1>
        <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-link btn-sm ms-auto">
            <i class="bi bi-arrow-left"></i> Back to user</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header bg-white fw-semibold">Status history</div>
                <div class="card-body">
                    <div th:replace="~{fragments/history :: statusTimeline(${statusHistory})}"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-white fw-semibold">Activity on this user <span class="text-secondary small fw-normal">(latest 100)</span></div>
                <div th:replace="~{fragments/history :: auditTable(${auditEntries}, false)}"></div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
