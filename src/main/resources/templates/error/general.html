<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${title} ?: 'Error'">Error</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="text-center py-5">
        <div class="display-4 text-secondary" th:text="${status}">Error</div>
        <h1 class="h4 mt-2" th:text="${title} ?: 'Something went wrong'">Something went wrong</h1>
        <p class="text-secondary" th:text="${message} ?: 'Please try again.'">Please try again.</p>
        <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house"></i> Home</a>
        <button class="btn btn-outline-secondary" onclick="history.back()">Go back</button>
    </div>
</th:block>
</body>
</html>
