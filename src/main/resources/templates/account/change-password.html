<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Change password</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1 class="h4 mb-3"><i class="bi bi-key"></i> Change password</h1>

            <div th:if="${forced}" class="alert alert-warning" role="alert">
                <i class="bi bi-exclamation-triangle"></i>
                Your password is temporary or has expired. Choose a new password to continue.
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/account/change-password}" th:object="${form}" method="post" novalidate>
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                            <div th:each="err : ${#fields.globalErrors()}" style="white-space: pre-line"
                                 th:text="${err}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current password</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   autocomplete="current-password">
                            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                            <div class="form-text" th:text="${passwordRules}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm new password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('confirmationMatching')} ? 'is-invalid'"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            <div class="invalid-feedback" th:errors="*{confirmationMatching}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Change password
                        </button>
                        <a th:unless="${forced}" th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
